name: WallPainter
options:
  bundleIdPrefix: tw.dj13
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  WallPainterCore:
    path: Packages/WallPainterCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WallPainter:
    type: application
    platform: iOS
    sources:
      - path: WallPainter
      - path: Models/WallSegmenter.mlpackage
        type: file
        buildPhase: sources
    dependencies:
      - package: WallPainterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.dj13.wallpainter
        PRODUCT_NAME: WallPainter
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 牆面換色
        INFOPLIST_KEY_NSCameraUsageDescription: 拍攝室內照片來模擬牆面配色。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 把換色後的照片存到相簿。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COREML_CODEGEN_LANGUAGE: None
    scheme: {}
